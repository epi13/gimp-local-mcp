version = 1
environment_allowlist = ["PATH", "LANG", "LC_ALL", "GIMP_MCP_HOST", "GIMP_MCP_PORT", "GIMP_MCP_TIMEOUT", "GIMP_MCP_VISION_PROVIDER", "GIMP_MCP_VISION_COMMAND", "GIMP_MCP_VISION_TIMEOUT", "GIMP_MCP_VISION_DEVICE", "GIMP_MCP_CLIPSEG_MODEL"]

[project]
name = "GIMP Local MCP development evidence"
identity = "gimp-local-mcp-development-v1"
root = "."

[paths]
candidates = ["src", "tests", "tools", "README.md", "CHANGELOG.md", "pyproject.toml", ".gitignore"]
generated = [".mncs-forge/outputs"]
contracts = []
references = []
evaluators = []
acceptance_policies = ["forge-selection.json"]
development_evidence = [".mncs-forge/outputs"]
protected = ["AGENTS.md", "SECURITY.md", "mncs-forge.toml", "forge-selection.json"]
outputs = [".mncs-forge/outputs"]

[limits]
timeout_seconds = 180
output_bytes = 1048576

[verifier_limits]
max_batch = 8
request_bytes = 65536
batch_timeout_seconds = 180
witness_bytes = 16384
stderr_bytes = 4096
result_bytes = 131072
max_changed_paths = 64
max_dependency_identities = 64
max_question_parameters = 16

[authority.development]
may_write_candidates = false
may_write_generated = true
may_run_providers = true

[authority.evaluator]
candidate_read_only = true
authority_read_only = true
require_frozen_identities = true
withhold_repair_feedback = true

[policies]
selection = "forge-selection.json"
useful_benefit_objective = "README.md"

[[providers]]
id = "gimp-local-mcp-project-checks"
name = "GIMP Local MCP project checks"
identity = "gimp-local-mcp-project-checks-v1"
version = "0.1"
command = ["python", "tools/forge_provider.py"]
transport = "stdio-jsonl"
required = true
capabilities = ["ruff-format", "ruff-check", "unit-tests", "vision-unit-tests", "layer-decomposition-tests", "live-gimp", "live-subject-isolation", "live-vision-bridge", "live-layer-decomposition", "vision-provider-status", "semantic-inference", "semantic-quality-uncertainty", "pip-check"]
supported_constructs = ["fixed-command-semantic-parsing", "live-gimp-availability", "live-subject-isolation-evidence", "layer-decomposition-evidence", "configured-provider-readiness", "actual-semantic-inference"]
unsupported_constructs = ["arbitrary-commands", "whole-project-proof", "semantic-quality-proof-without-ground-truth", "sam3-availability-proof"]
limitations = ["development evidence only; commands use the ambient project environment"]

[[workflows]]
name = "project-checks"
category = "inspection"
mode = "development"
subject = "project"
command = ["python", "tools/forge_provider.py"]
provider_protocol = true
provider_id = "gimp-local-mcp-project-checks"
disclosure = "compact"

[[verifiers]]
id = "project.vision-unit-tests"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "vision-unit-tests"
claim = "Deterministic local vision protocol, artifact, provider, and routing tests completed without failures."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "tests"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["This verifies the optional provider boundary, not SAM model availability or segmentation quality."]
assumptions = ["pytest output contains a decisive passing summary"]
timeout_seconds = 60
cost = "medium"
uncertainty_classes = ["test-failure", "provider-availability"]

[[verifiers]]
id = "project.live-vision-bridge"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "live-vision-bridge"
claim = "The live GIMP snapshot and soft-alpha mask bridge completed a deterministic non-destructive workflow."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "integration"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["This uses a deterministic fake local provider and does not establish SAM availability or semantic quality."]
assumptions = ["the configured loopback Script-Fu endpoint is the GIMP under test"]
timeout_seconds = 120
cost = "high"
uncertainty_classes = ["live-dependency", "provider-availability"]

[[verifiers]]
id = "project.layer-decomposition-tests"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "layer-decomposition-tests"
claim = "Complementary soft-mask algebra, bounded multi-concept layering, overlap reporting, naming, source preservation, selection behavior, and rollback tests completed without failures."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "tests"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["Deterministic fake-provider evidence does not establish real semantic quality."]
assumptions = ["pytest output contains a decisive passing summary"]
timeout_seconds = 60
cost = "medium"
uncertainty_classes = ["test-failure", "layer-decomposition"]

[[verifiers]]
id = "project.live-layer-decomposition"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "live-layer-decomposition"
claim = "A disposable live GIMP document retained a generated group with complementary subject/background masks and an unchanged original source layer."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "integration"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["The deterministic fake provider establishes GIMP layering, not semantic quality."]
assumptions = ["the configured loopback Script-Fu endpoint is the GIMP under test"]
timeout_seconds = 120
cost = "high"
uncertainty_classes = ["live-dependency", "layer-decomposition"]

[[verifiers]]
id = "project.vision-provider-status"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "vision-provider-status"
claim = "The configured local provider found its checkpoint, loaded its model, and passed a provider-side self-test."
category = "inspection"
modes = ["development"]
artifact_types = ["environment"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["Unavailable optional providers are UNKNOWN, never PASS; readiness is not mask quality."]
assumptions = ["trusted provider configuration identifies the intended local worker"]
timeout_seconds = 120
cost = "high"
uncertainty_classes = ["provider-availability", "model-readiness"]

[[verifiers]]
id = "project.semantic-inference"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "semantic-inference"
claim = "The configured real local provider completed an actual bounded text-prompted segmentation inference."
category = "inspection"
modes = ["development"]
artifact_types = ["environment", "runtime"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["Successful inference does not establish usefulness or pixel accuracy."]
assumptions = ["trusted provider configuration identifies the intended local worker"]
timeout_seconds = 120
cost = "high"
uncertainty_classes = ["provider-availability", "semantic-inference"]

[[verifiers]]
id = "project.semantic-quality-uncertainty"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "semantic-quality-uncertainty"
claim = "Semantic pixel accuracy remains unknown without ground truth."
category = "inspection"
modes = ["development"]
artifact_types = ["evidence"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["Provider confidence and mask proxies are not accuracy or IoU."]
assumptions = []
timeout_seconds = 5
cost = "low"
uncertainty_classes = ["segmentation-quality"]

[[verifiers]]
id = "project.ruff-format"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "ruff-format"
claim = "Ruff formatting verification completed without findings."
category = "inspection"
modes = ["development"]
artifact_types = ["source"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["This is a bounded local development check."]
assumptions = ["the fixed Ruff command is the declared formatting check"]
timeout_seconds = 30
cost = "low"
uncertainty_classes = ["formatting"]

[[verifiers]]
id = "project.ruff-check"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "ruff-check"
claim = "Ruff lint verification completed without findings."
category = "inspection"
modes = ["development"]
artifact_types = ["source"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["This is a bounded local development check."]
assumptions = ["the fixed Ruff command is the declared lint check"]
timeout_seconds = 30
cost = "low"
uncertainty_classes = ["linting"]

[[verifiers]]
id = "project.unit-tests"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "unit-tests"
claim = "The repository unit test suite completed without failures."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "tests"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["A passing bounded test suite is development evidence, not an independent proof."]
assumptions = ["pytest output contains a decisive passing summary"]
timeout_seconds = 60
cost = "medium"
uncertainty_classes = ["test-failure"]

[[verifiers]]
id = "project.live-gimp"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "live-gimp"
claim = "The configured local GIMP Script-Fu server responded and the bounded live integration workflow completed successfully."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "integration"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["A skipped or unavailable GIMP integration is UNKNOWN, never PASS."]
assumptions = ["the configured loopback Script-Fu endpoint is the GIMP under test"]
timeout_seconds = 120
cost = "high"
uncertainty_classes = ["live-dependency"]

[[verifiers]]
id = "project.live-subject-isolation"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "live-subject-isolation"
claim = "The live GIMP mask foundation completed a deterministic synthetic non-destructive mask workflow and emitted bounded quality metrics."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "integration"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["This verifies deterministic live mask behavior, not semantic subject segmentation quality."]
assumptions = ["the configured loopback Script-Fu endpoint is the GIMP under test"]
timeout_seconds = 120
cost = "high"
uncertainty_classes = ["live-dependency", "segmentation-quality"]

[[verifiers]]
id = "project.pip-check"
version = "0.1"
workflow = "project-checks"
provider = "gimp-local-mcp-project-checks"
method = "pip-check"
claim = "Python dependency verification found no broken requirements."
category = "inspection"
modes = ["development"]
artifact_types = ["source", "environment"]
scopes = ["candidate"]
input_kinds = ["candidate_identity"]
limitations = ["This reports the current Python environment only."]
assumptions = ["pip check output is the dependency verifier's declared result"]
timeout_seconds = 30
cost = "low"
uncertainty_classes = ["dependency-drift"]
