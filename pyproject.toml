[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gimp-local-mcp"
version = "0.1.0"
description = "Local-first MCP server for structured control of GIMP 3"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[project.scripts]
gimp-local-mcp = "gimp_local_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gimp_local_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a live GIMP 3 Script-Fu server",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
